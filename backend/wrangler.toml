# backend/wrangler.toml
name = "test"
main = "src/index.js"
compatibility_date = "2026-09-09"

# PENTING: coba redam masalah "vars/secret ke-reset tiap deploy dari GitHub
# integration Cloudflare" (bug resmi: github.com/cloudflare/workers-sdk/issues/8871).
# keep_vars=true bilang ke Cloudflare "jangan hapus vars/secret yang sudah ada di
# dashboard walau tidak disebut di [vars] file ini". TIDAK 100% dijamin work di semua
# kasus (ada laporan komunitas yang masih kena walau sudah pakai ini) — kalau secret
# tetap hilang setelah ini, solusi paling pasti adalah pindah dari "GitHub integration"
# bawaan Cloudflare ke GitHub Actions + wrangler-action (secret disimpan di GitHub,
# di-inject ulang tiap deploy, bukan disimpan manual di dashboard Cloudflare).
keep_vars = true

# Satu cron saja (tiap 5 menit) supaya hemat kuota akun Workers Free (maks 5 cron
# per AKUN, bukan per Worker). Semua jadwal lain dibedakan di scheduled() (index.js)
# berdasarkan jam UTC dari event.scheduledTime:
#   tiap 5 menit        -> cek ulang status order PPOB yang masih pending
#   03:00 UTC (10 WIB)  -> bersih-bersih data lama (>1 tahun)
#   23:00 UTC (06 WIB)  -> sinkron harga PPOB OkeConnect, sekali sehari
#   00/06/12/18 UTC     -> sinkron saldo dompet distributor (Saldo.PIN via Jabber)
#   17:00 UTC (00 WIB)  -> snapshot harian Pertumbuhan Modal (modal.js)
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kasir-ppob-db"
database_id = "16b154f7-7235-403e-9ddb-7dd1da4b20b7"

[vars]
# Alamat Jabber tujuan transaksi. OkeConnect kasih 2 opsi:
#   okeconnect@gojabber.com        -> dapat bounce "service-unavailable" saat dites
#   center@mitra.orderkuota.com    -> dicoba sebagai alternatif
# Ganti nilainya di sini lalu `wrangler deploy` untuk tes cepat tanpa ubah kode.
JABBER_TARGET = "center@mitra.orderkuota.com"
# Opsional: format perintah cek status order pending. Bawaan "CEK.{target}"
# (CEK + nomor tujuan). Placeholder: {ref} {product} {target} {pin}.
# JABBER_CEK_TEMPLATE = "CEK.{target}"

# Secrets (isi lewat: wrangler secret put NAMA, ATAU dashboard Cloudflare
# Settings -> Variables and Secrets -> tipe "Secret")
#   TELEGRAM_BOT_TOKEN     -> token bot dari @BotFather
#   TELEGRAM_SECRET        -> token rahasia untuk validasi webhook Telegram
#   JABBER_JID             -> akun Jabber OkeConnect yang Anda daftarkan SENDIRI (bukan ID OrderKuota OK310547),
#                              harus sama dengan yang diisi di kolom "Jabber 1" Pengaturan OkeConnect
#   JABBER_PASSWORD        -> password akun Jabber OkeConnect tersebut (bukan password OrderKuota)
#   JABBER_PIN             -> PIN transaksi PPOB OkeConnect Anda
