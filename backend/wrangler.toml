# backend/wrangler.toml
name = "test"
main = "src/index.js"
compatibility_date = "2026-09-09"

# Cron untuk cek ulang transaksi PPOB yang masih "pending" (misal balasan Jabber telat)
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kasir-ppob-db"
database_id = "22e31388-c654-4bc4-8b3b-21e2fba11dcb"

# Secrets (isi lewat: wrangler secret put NAMA)
#   TELEGRAM_BOT_TOKEN   -> token bot dari @BotFather
#   TELEGRAM_SECRET      -> token rahasia untuk validasi webhook Telegram
#   JABBER_JID           -> User ID OrderKuota Anda, mis. OK310547@gojabber.com
#   JABBER_PASSWORD      -> password akun OrderKuota Anda
#   JABBER_PIN           -> PIN transaksi PPOB Anda
