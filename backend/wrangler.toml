name = "mesinworker"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mesinv2_db"
database_id = "287d8c2f-413b-4c2d-967c-083cfcd82835"

# Cron: jalan tiap hari jam 02:00 UTC untuk hapus data transaksi > 2 tahun
[triggers]
crons = ["0 2 * * *"]

# --------------------------------------------------------------
# JANGAN taruh secret di sini. Set via CLI:
#   wrangler secret put JWT_SECRET
#   wrangler secret put TURNSTILE_SECRET
# --------------------------------------------------------------
